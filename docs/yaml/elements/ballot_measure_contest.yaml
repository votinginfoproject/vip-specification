_name: BallotMeasureContest
csv-header-name: ballot_measure_contest
csv-post: |-
  .. code-block:: csv-table
     :linenos:

      id,abbreviation,ballot_selection_ids,ballot_title,electoral_district_id,name,passage_threshold,type
      bmc0001,HB2,bs001 bs002,School Bond Issue,ed001,School Bond Issue,majority,referendum
description: |-
  BallotMeasureContest extends :ref:`$$$-contest-base` and provides information about a ballot measure or referendum before the voters.

  In overlay feeds, clearable fields can be cleared using ``<Clear{FieldName}/>`` (e.g. ``<ClearConStatement/>``, ``<ClearProStatement/>``, ``<ClearFullText/>``).
extends:
- ContestBase
post: |-
  .. code-block:: xml
     :linenos:

     <BallotMeasureContest id="bmc30001">
        <BallotSelectionIds>bms30001a bms30001b</BallotSelectionIds>
        <BallotTitle>
           <Text language="en">State Bond Initiative</Text>
           <Text language="es">Iniciativa de Bonos del Estado</Text>
        </BallotTitle>
        <ElectoralDistrictId>ed60129</ElectoralDistrictId>
        <Name>Bond Initiative</Name>
        <ConStatement>
           <Text language="en">Opponents argue this increases state debt.</Text>
        </ConStatement>
        <ProStatement>
           <Text language="en">Supporters state this funds critical school repairs.</Text>
        </ProStatement>
        <Type>referendum</Type>
     </BallotMeasureContest>
tags:
- _name: ConStatement
  csv-header-name: con_statement
  csv-type: InternationalizedText
  description: Statement in opposition to the measure. Clearable in overlays.
  error_then: =must-ignore
  type: InternationalizedText
- _name: EffectOfAbstain
  csv-header-name: effect_of_abstain
  csv-type: InternationalizedText
  description: Describes effect of abstaining on the measure. Clearable in overlays.
  error_then: =must-ignore
  type: InternationalizedText
- _name: FullText
  csv-header-name: full_text
  csv-type: InternationalizedText
  description: Full legal text of the ballot measure. Clearable in overlays.
  error_then: =must-ignore
  type: InternationalizedText
- _name: InfoUri
  csv-header-name: info_uri
  csv-type: InternationalizedUri
  description: Web address for additional information about the measure. Clearable
    in overlays.
  error_then: =must-ignore
  type: InternationalizedUri
- _name: PassageThreshold
  csv-header-name: passage_threshold
  csv-type: InternationalizedText
  description: Threshold required for passage (e.g. "majority", "two-thirds"). Clearable
    in overlays.
  error_then: =must-ignore
  type: InternationalizedText
- _name: ProStatement
  csv-header-name: pro_statement
  csv-type: InternationalizedText
  description: Statement in support of the measure. Clearable in overlays.
  error_then: =must-ignore
  type: InternationalizedText
- _name: SummaryText
  csv-header-name: summary_text
  csv-type: InternationalizedText
  description: Summary explanation of the measure. Clearable in overlays.
  error_then: =must-ignore
  type: InternationalizedText
- _name: Type
  csv-header-name: type
  csv-type: BallotMeasureType
  description: Type of measure from :ref:`$$$-ballot-measure-type`. Clearable in overlays.
  error_then: =must-ignore
  type: BallotMeasureType
- _name: OtherType
  csv-header-name: other_type
  csv-type: xs:string
  description: Custom measure type if Type is "other". Clearable in overlays.
  error_then: =must-ignore
  type: xs:string
