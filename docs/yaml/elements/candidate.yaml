_name: Candidate
csv-header-name: candidate
csv-post: |-
  .. code-block:: csv-table
     :linenos:

      id,ballot_name,file_date,is_incumbent,is_top_ticket,party_id,person_id,post_election_status,pre_election_status
      can001,Jude Fawley,2024-03-01,true,false,par01,per50001,,qualified
description: The Candidate object represents a candidate in a contest. If a candidate
  is running in multiple contests, each contest **must** have its own Candidate object.
post: |-
  .. code-block:: xml
     :linenos:

     <Candidate id="can10961">
        <BallotName>
           <Text language="en">Ken T. Cuccinelli II</Text>
        </BallotName>
        <PartyId>par0001</PartyId>
        <PersonId>per10961</PersonId>
     </Candidate>
tags:
- _name: BallotName
  csv-header-name: ballot_name
  csv-type: InternationalizedText
  description: The candidate's name as it will appear on the ballot.
  required: true
  type: InternationalizedText
- _name: ContactInformation
  csv-header-name: contact_information
  csv-type: ContactInformation
  description: Campaign or official contact information for the candidate.
  error_then: =must-ignore
  type: ContactInformation
- _name: ExternalIdentifier
  csv-header-name: external_identifier
  csv-type: ExternalIdentifier
  description: External identifier(s) linking this candidate to external systems.
  error_then: =must-ignore
  repeating: true
  type: ExternalIdentifier
- _name: FileDate
  csv-header-name: file_date
  csv-type: xs:date
  description: Date when the candidate filed for office.
  error_then: =must-ignore
  type: xs:date
- _name: IsIncumbent
  csv-header-name: is_incumbent
  csv-type: xs:boolean
  description: Indicates whether the candidate currently holds the office.
  error_then: =must-ignore
  type: xs:boolean
- _name: IsTopTicket
  csv-header-name: is_top_ticket
  csv-type: xs:boolean
  description: Indicates whether the candidate is at the top of a ticket.
  error_then: =must-ignore
  type: xs:boolean
- _name: PartyId
  csv-header-name: party_id
  csv-type: xs:IDREF
  description: References the candidate's affiliated :ref:`$$$-party`.
  error_then: =must-ignore
  type: xs:IDREF
- _name: PersonId
  csv-header-name: person_id
  csv-type: xs:IDREF
  description: References the underlying :ref:`$$$-person` record.
  error_then: =must-ignore
  type: xs:IDREF
- _name: PostElectionStatus
  csv-header-name: post_election_status
  csv-type: CandidatePostElectionStatus
  description: Final status of the candidate from :ref:`$$$-candidate-post-election-status`
    (e.g. winner, withdrawn, etc...).
  error_then: =must-ignore
  type: CandidatePostElectionStatus
- _name: PreElectionStatus
  csv-header-name: pre_election_status
  csv-type: CandidatePreElectionStatus
  description: Registration status of the candidate from :ref:`$$$-candidate-pre-election-status`
    (e.g. filed, qualified, etc...).
  error_then: =must-ignore
  type: CandidatePreElectionStatus
