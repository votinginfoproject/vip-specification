_name: ContactInformation
csv-header-name: contact_information
csv-post: |-
  .. code-block:: csv-table
     :linenos:

      label,directions,email,fax,hours,name,phone,uri
      ci001,Use entrance on Main St,info@example.gov,,08:00-17:00,Elections Office,555-0100,https://example.gov
description: Defines contact information (addresses, location identifiers, phone numbers,
  emails, schedules) for persons, election offices, voter services, or polling locations.
  ContactInformation has an optional attribute ``label``.
post: |-
  .. code-block:: xml
     :linenos:

     <ContactInformation label="office_contact">
        <PhysicalAddress language="en">
           <LocationName>City Hall</LocationName>
           <AddressLine>100 N Main St, Room 101</AddressLine>
           <City>Springfield</City>
           <Region>IL</Region>
           <PostalCode>62701</PostalCode>
        </PhysicalAddress>
        <LocationIdentifier provider="google">
           <Type>pluscode</Type>
           <Value>86HJQPRX+86</Value>
        </LocationIdentifier>
        <Email>elections@springfield.gov</Email>
        <Phone>217-555-0100</Phone>
        <Schedule>
           <TimeZone>America/Chicago</TimeZone>
           <Hours>
              <StartTime>08:30:00</StartTime>
              <EndTime>16:30:00</EndTime>
           </Hours>
        </Schedule>
        <Uri>https://elections.springfield.gov</Uri>
     </ContactInformation>
tags:
- _name: MailingAddress
  csv-header-name: mailing_address
  csv-type: SimpleAddressType
  description: Structured mailing address for the contact. Multiple addresses in different
    languages can be specified.
  error_then: =must-ignore
  repeating: true
  type: SimpleAddressType
- _name: PhysicalAddress
  csv-header-name: physical_address
  csv-type: SimpleAddressType
  description: Structured physical address for the contact. Multiple addresses in
    different languages can be specified.
  error_then: =must-ignore
  repeating: true
  type: SimpleAddressType
- _name: LocationIdentifier
  csv-header-name: location_identifier
  csv-type: LocationIdentifier
  description: External location identifier(s) (e.g. Plus Code, coordinates).
  error_then: =must-ignore
  repeating: true
  type: LocationIdentifier
- _name: Directions
  csv-header-name: directions
  csv-type: InternationalizedText
  description: Directions for finding or reaching the contact location.
  error_then: =must-ignore
  type: InternationalizedText
- _name: Email
  csv-header-name: email
  csv-type: InternationalizedText
  description: Email address(es) for the contact.
  error_then: =must-ignore
  repeating: true
  type: InternationalizedText
- _name: Fax
  csv-header-name: fax
  csv-type: InternationalizedText
  description: Fax number(s) for the contact.
  error_then: =must-ignore
  repeating: true
  type: InternationalizedText
- _name: Hours
  csv-header-name: hours
  csv-type: InternationalizedText
  description: 'Operating hours as free-form text. *(NB: deprecated in favor of :ref:`$$$-schedule-with-timezone`)*.'
  error_then: =must-ignore
  type: InternationalizedText
- _name: Schedule
  csv-header-name: schedule
  csv-type: ScheduleWithTimezone
  description: Structured schedule with dates and operating hours.
  error_then: =must-ignore
  repeating: true
  type: ScheduleWithTimezone
- _name: LatLng
  csv-header-name: lat_lng
  csv-type: LatLng
  description: Latitude and longitude coordinates.
  error_then: =must-ignore
  type: LatLng
- _name: Name
  csv-header-name: name
  csv-type: InternationalizedText
  description: Person or place name associated with this contact information.
  error_then: =must-ignore
  type: InternationalizedText
- _name: Phone
  csv-header-name: phone
  csv-type: InternationalizedText
  description: Telephone number(s) for the contact.
