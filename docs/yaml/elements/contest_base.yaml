_name: ContestBase
csv-header-name: contest_base
description: |-
  A base model for all Contest types: :ref:`$$$-ballot-measure-contest`, :ref:`$$$-candidate-contest`, :ref:`$$$-party-contest`, and :ref:`$$$-retention-contest`.

  In overlay feeds, clearable fields can be cleared using empty ``<Clear{FieldName}/>`` elements (e.g. ``<ClearAbbreviation/>``, ``<ClearBallotSelectionIds/>``, ``<ClearIsInactive/>``). Name and ElectoralDistrictId are optional in overlays.
tags:
- _name: Abbreviation
  csv-header-name: abbreviation
  csv-type: xs:string
  description: An abbreviation for the contest. Clearable in overlays.
  error_then: =should-ignore
  type: xs:string
- _name: BallotSelectionIds
  csv-header-name: ballot_selection_ids
  csv-type: xs:IDREFS
  description: References BallotSelections belonging to this contest. Clearable in
    overlays.
  error_then: =should-ignore
  type: xs:IDREFS
- _name: BallotSubTitle
  csv-header-name: ballot_sub_title
  csv-type: InternationalizedText
  description: Subtitle of the contest as it appears on the ballot. Clearable in overlays.
  error_then: =should-ignore
  type: InternationalizedText
- _name: BallotTitle
  csv-header-name: ballot_title
  csv-type: InternationalizedText
  description: Title of the contest as it appears on the ballot. Clearable in overlays.
  error_then: =should-ignore
  type: InternationalizedText
- _name: ElectoralDistrictId
  csv-header-name: electoral_district_id
  csv-type: xs:IDREF
  description: References the :ref:`$$$-electoral-district` representing the geographical
    scope of the contest. Required in main feed; optional in overlays.
  required: true
  type: xs:IDREF
- _name: ElectorateSpecification
  csv-header-name: electorate_specification
  csv-type: InternationalizedText
  description: Specifies rules or changes regarding eligible electors for this contest
    (e.g. party affiliation for primaries). Clearable in overlays.
  error_then: =should-ignore
  type: InternationalizedText
- _name: ExternalIdentifier
  csv-header-name: external_identifier
  csv-type: ExternalIdentifier
  description: External identifier(s) linking this contest to other sources. Clearable
    in overlays.
  error_then: =should-ignore
  repeating: true
  type: ExternalIdentifier
- _name: HasRotation
  csv-header-name: has_rotation
  csv-type: xs:boolean
  description: Indicates whether the selections in the contest rotate on the ballot.
    Clearable in overlays.
  error_then: =should-ignore
  type: xs:boolean
- _name: Name
  csv-header-name: name
  csv-type: xs:string
  description: Name of the contest. Required in main feed; optional in overlays.
  required: true
  type: xs:string
- _name: SequenceOrder
  csv-header-name: sequence_order
  csv-type: xs:integer
  description: Default ballot ordering for the contest. Clearable in overlays.
  error_then: =should-ignore
  type: xs:integer
- _name: VoteVariation
  csv-header-name: vote_variation
  csv-type: VoteVariation
  description: Voting variation (e.g. plurality, majority, rcv) from :ref:`$$$-vote-variation`.
    Clearable in overlays.
  error_then: =should-ignore
  type: VoteVariation
- _name: OtherVoteVariation
  csv-header-name: other_vote_variation
  csv-type: xs:string
  description: Custom voting variation if VoteVariation is "other". Clearable in overlays.
  error_then: =should-ignore
  type: xs:string
- _name: IsInactive
  csv-header-name: is_inactive
  csv-type: xs:string
  description: If specified, marks the contest as inactive with the reason why. Clearable
    in overlays.
  error_then: =should-ignore
  type: xs:string
