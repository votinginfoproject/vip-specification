_name: EmergencyNotice
csv-header-name: emergency_notice
description: |-
  A notification for election administrators to post emergency or last-minute updates (e.g. polling place relocations, hours extensions, severe weather alerts).

  In VIP 7.0, EmergencyNotice elements are permitted only in feed overlays on :ref:`$$$-locality`, :ref:`$$$-polling-location`, and :ref:`$$$-precinct` elements.
post: |-
  .. code-block:: xml
     :linenos:

     <EmergencyNotice>
        <NoticeText>
           <Text language="en">Polling location moved due to water main break.</Text>
           <Text language="es">El centro de votación se ha trasladado debido a una rotura de tubería.</Text>
        </NoticeText>
        <NoticeUri>https://elections.example.gov/notices/precinct-203</NoticeUri>
        <AppliesTo>polling_place</AppliesTo>
     </EmergencyNotice>
skip_element_on: csv
tags:
- _name: NoticeText
  csv-header-name: notice_text
  csv-type: InternationalizedText
  description: The emergency notification text, which may be localized in multiple
    languages.
  error_then: =must-ignore
  repeating: true
  required: false
  type: InternationalizedText
- _name: NoticeUri
  csv-header-name: notice_uri
  csv-type: InternationalizedUri
  description: Web address for additional information regarding the emergency notice.
  error_then: =must-ignore
  required: false
  type: InternationalizedUri
- _name: AppliesTo
  csv-header-name: applies_to
  csv-type: xs:string
  description: If specified, the contexts in which this emergency notice applies (e.g.
    "polling_place", "vote_center", "ballot_drop_box", "jurisdiction"). If omitted,
    applies generally.
  error_then: =must-ignore
  repeating: true
  required: false
  type: xs:string
