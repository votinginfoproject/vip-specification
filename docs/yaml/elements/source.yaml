_name: Source
csv-header-name: source
csv-post: |-
  .. code-block:: csv-table
     :linenos:

      id,date_time,description,name,organization_uri,terms_of_use_uri,vip_id
      source01,2024-10-24T14:25:28,SBE is official source,"State Board of Elections",http://www.sbe.virginia.gov/,http://example.com/terms,51
description: The Source object represents the organization publishing the information.
  In a VIP 7.0 main feed file, exactly one Source object must be present. Source is
  excluded from feed overlays.
post: |-
  .. _FIPS: https://www.census.gov/geo/reference/codes/cou.html

  .. code-block:: xml
     :linenos:

     <Source id="src1">
        <DateTime>2024-10-24T14:25:28</DateTime>
        <Description>
           <Text language="en">SBE is the official source for Virginia election data.</Text>
        </Description>
        <FeedContactInformation>
           <Name>State Board of Elections Support</Name>
           <Email>elections@sbe.virginia.gov</Email>
        </FeedContactInformation>
        <Name>State Board of Elections, Commonwealth of Virginia</Name>
        <OrganizationUri>http://www.sbe.virginia.gov/</OrganizationUri>
        <TermsOfUseUri>http://www.sbe.virginia.gov/terms</TermsOfUseUri>
        <VipId>51</VipId>
     </Source>
tags:
- _name: DateTime
  csv-header-name: date_time
  csv-type: xs:dateTime
  description: Specifies the date and time of feed production (e.g. "2024-11-05T08:30:00").
    Considered to be in the timezone local to the organization.
  required: true
  type: xs:dateTime
- _name: Description
  csv-header-name: description
  csv-type: InternationalizedText
  description: Specifies both the nature of the organization providing the data and
    what data is in the feed (e.g. "Virginia Department of Elections official candidate
    and polling location feed for the 2024 General Election").
  error_then: =must-ignore
  type: InternationalizedText
- _name: FeedContactInformation
  csv-header-name: feed_contact_information_id
  csv-type: ContactInformation
  description: Contact information for inquiries about the feed data.
  error_then: =must-ignore
  type: ContactInformation
- _name: Name
  csv-header-name: name
  csv-type: xs:string
  description: Specifies the name of the organization publishing the feed.
  required: true
  type: xs:string
- _name: OrganizationUri
  csv-header-name: organization_uri
  csv-type: InternationalizedUri
  description: Web address of the organization publishing the feed.
  error_then: =must-ignore
  type: InternationalizedUri
- _name: TermsOfUseUri
  csv-header-name: terms_of_use_uri
  csv-type: InternationalizedUri
  description: Web address where Terms of Use for the feed data can be found.
  error_then: =must-ignore
  type: InternationalizedUri
- _name: VipId
  csv-header-name: vip_id
  csv-type: xs:string
  description: Specifies the ID of the organization publishing the feed. VIP uses
    FIPS codes for this ID (e.g. "51" for Virginia).
  required: true
  type: xs:string
