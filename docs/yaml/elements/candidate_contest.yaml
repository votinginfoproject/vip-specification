_name: CandidateContest
csv-header-name: candidate_contest
csv-post: |-
  .. code-block:: csv-table
     :linenos:

      id,ballot_selection_ids,ballot_title,electoral_district_id,name,number_elected,office_ids,primary_party_ids,votes_allowed
      cc001,cs001 cs002,Governor of Virginia,ed001,Governor,1,off001,par01,1
description: |-
  CandidateContest extends :ref:`$$$-contest-base` and represents a contest among candidates.

  In overlay feeds, clearable fields can be cleared using ``<Clear{FieldName}/>`` (e.g. ``<ClearNumberElected/>``, ``<ClearOfficeIds/>``, ``<ClearPrimaryPartyIds/>``, ``<ClearVotesAllowed/>``).
extends:
- ContestBase
post: |-
  .. code-block:: xml
     :linenos:

     <CandidateContest id="cc20003">
        <BallotSelectionIds>cs10961 cs10962</BallotSelectionIds>
        <BallotTitle>
           <Text language="en">Governor of Virginia</Text>
        </BallotTitle>
        <ElectoralDistrictId>ed60129</ElectoralDistrictId>
        <Name>Governor</Name>
        <NumberElected>1</NumberElected>
        <OfficeIds>off0000</OfficeIds>
        <VotesAllowed>1</VotesAllowed>
     </CandidateContest>
tags:
- _name: NumberElected
  csv-header-name: number_elected
  csv-type: xs:integer
  description: Number of candidates elected in this contest (i.e. "N" of N-of-M).
    Clearable in overlays.
  error_then: =must-ignore
  type: xs:integer
- _name: OfficeIds
  csv-header-name: office_ids
  csv-type: xs:IDREFS
  description: 'References a set of :ref:`$$$-office` elements, if available, which
    give additional information about the offices. Note: the order of the office IDs
    must be in the same order as the candidates listed in BallotSelectionIds (e.g.,
    if BallotSelectionIds reference candidate selections with President first and
    Vice-President second, OfficeIds should reference the office of President first
    and Vice-President second). Clearable in overlays.'
  error_then: =must-ignore
  type: xs:IDREFS
- _name: PrimaryPartyIds
  csv-header-name: primary_party_ids
  csv-type: xs:IDREFS
  description: References :ref:`$$$-party` elements if the contest is party-specific
    (e.g. a Democratic or Republican primary). Clearable in overlays.
  error_then: =must-ignore
  type: xs:IDREFS
- _name: VotesAllowed
  csv-header-name: votes_allowed
  csv-type: xs:integer
  description: Maximum number of selections a voter may make in this contest. Clearable
    in overlays.
  error_then: =must-ignore
  type: xs:integer
