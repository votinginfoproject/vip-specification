_name: Election
csv-header-name: election
csv-post: |-
  .. code-block:: csv-table
     :linenos:

      id,date,name,election_type,top_level_locality_id,is_statewide,registration_info,absentee_ballot_info,results_uri,has_election_day_registration,registration_deadline,absentee_request_deadline
      ele001,2024-11-05,2024 General Election,General,loc51,true,https://vote.va.gov/register,https://vote.va.gov/absentee,https://vote.va.gov/results,false,2024-10-15,2024-10-25
description: |-
  The Election object represents an election event. A feed must contain **exactly one** Election object in the main feed. In feed overlays, Election can appear to update election metadata.

  In overlay feeds, clearable fields can be cleared using ``<Clear{FieldName}/>`` (e.g. ``<ClearSchedule/>``, ``<ClearAbsenteeBallotInfo/>``). Fields that are required in the main feed (Date and TopLevelLocalityId) are optional in overlays.
post: |-
  .. code-block:: xml
     :linenos:

     <Election id="ele30000">
        <Date>2024-11-05</Date>
        <Name>
           <Text language="en">2024 General Election</Text>
           <Text language="es">Elecciones Generales de 2024</Text>
        </Name>
        <ElectionType>General</ElectionType>
        <HasElectionDayRegistration>false</HasElectionDayRegistration>
        <IsStatewide>true</IsStatewide>
        <RegistrationDeadline>2024-10-15</RegistrationDeadline>
        <AbsenteeRequestDeadline>2024-10-25</AbsenteeRequestDeadline>
        <ResultsUri>https://www.sbe.virginia.gov/ElectionResults.html</ResultsUri>
        <TopLevelLocalityId>loc51</TopLevelLocalityId>
     </Election>
tags:
- _name: AbsenteeBallotInfo
  csv-header-name: absentee_ballot_info
  csv-type: InternationalizedText
  description: Information about requesting absentee ballots.
  error_then: =must-ignore
  type: InternationalizedText
- _name: AbsenteeRequestDeadline
  csv-header-name: absentee_request_deadline
  csv-type: xs:date
  description: Specifies the last day to request an absentee ballot (e.g. "2024-10-25").
  error_then: =must-ignore
  type: xs:date
- _name: Date
  csv-header-name: date
  csv-type: xs:date
  description: Date of the election in local time. Required in main feed; optional
    in overlays.
  required: true
  type: xs:date
- _name: ElectionType
  csv-header-name: election_type
  csv-type: InternationalizedText
  description: Specifies the type or highest controlling authority for the election
    (e.g. federal, state, county, city, town, or general, primary, special).
  error_then: =must-ignore
  type: InternationalizedText
- _name: HasElectionDayRegistration
  csv-header-name: has_election_day_registration
  csv-type: xs:boolean
  description: Specifies if a voter can register on the same day of the election (i.e.,
    the last day of the election). Valid values are "true" and "false".
  error_then: =must-ignore
  type: xs:boolean
- _name: Schedule
  csv-header-name: schedule
  csv-type: ScheduleWithTimezone
  description: Schedule of voting dates and hours for the election.
  error_then: =must-ignore
  repeating: true
  type: ScheduleWithTimezone
- _name: IsStatewide
  csv-header-name: is_statewide
  csv-type: xs:boolean
  description: Indicates whether the election is statewide.
  error_then: =must-ignore
  type: xs:boolean
- _name: Name
  csv-header-name: name
  csv-type: InternationalizedText
  description: The name of the election.
  error_then: =must-ignore
  type: InternationalizedText
- _name: RegistrationDeadline
  csv-header-name: registration_deadline
  csv-type: xs:date
  description: Specifies the last day to register for the election with the possible
    exception of Election Day registration (e.g. "2024-10-15").
  error_then: =must-ignore
  type: xs:date
- _name: RegistrationInfo
  csv-header-name: registration_info
  csv-type: InternationalizedText
  description: Information about voter registration.
  error_then: =must-ignore
  type: InternationalizedText
- _name: ResultsUri
  csv-header-name: results_uri
  csv-type: InternationalizedUri
  description: Web address where election results may be found.
  error_then: =must-ignore
  type: InternationalizedUri
- _name: TopLevelLocalityId
  csv-header-name: top_level_locality_id
  csv-type: xs:IDREF
  description: Links to the top-level :ref:`$$$-locality` for the election (e.g. the
    state locality). Required in main feed; optional in overlays.
  error: If the field is invalid or not present, the implementation is required to
    ignore the Election containing it.
  required: true
  type: xs:IDREF
