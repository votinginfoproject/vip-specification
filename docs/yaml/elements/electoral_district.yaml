_name: ElectoralDistrict
csv-header-name: electoral_district
csv-post: |-
  .. code-block:: csv-table
     :linenos:

      id,name,number,type,other_type
      ed60129,57th House of Delegates District,57,state-house,
description: |-
  The ``ElectoralDistrict`` object represents the geographic area in which contests are held or representation is defined. Examples of ``ElectoralDistrict`` include: "the state of Maryland", "Virginia's 5th Congressional District", or "Union School District". The geographic area that comprises an ``ElectoralDistrict`` is defined by which precincts link to the ``ElectoralDistrict``.

  In overlay feeds, clearable fields can be cleared using ``<Clear{FieldName}/>`` (e.g. ``<ClearNumber/>``, ``<ClearExternalIdentifier/>``). Name and Type are optional in overlays.
post: |-
  .. code-block:: xml
     :linenos:

     <ElectoralDistrict id="ed60129">
        <ExternalIdentifier>
           <Type>ocd-id</Type>
           <Value>ocd-division/country:us/state:va/sldl:57</Value>
        </ExternalIdentifier>
        <Name>
           <Text language="en">Virginia's 57th House of Delegates district</Text>
        </Name>
        <Number>57</Number>
        <Type>state-house</Type>
     </ElectoralDistrict>
tags:
- _name: ExternalIdentifier
  csv-header-name: external_identifier
  csv-type: ExternalIdentifier
  description: External identifier(s) linking this district to other datasets (e.g.
    OCD-ID). Clearable in overlays.
  error_then: =must-ignore
  repeating: true
  type: ExternalIdentifier
- _name: Name
  csv-header-name: name
  csv-type: InternationalizedText
  description: Name of the district. Required in main feed; optional in overlays.
  required: true
  type: InternationalizedText
- _name: Number
  csv-header-name: number
  csv-type: xs:integer
  description: Specifies the district number of the district (e.g. 34, in the case
    of the 34th State Senate District, or 5). If a number is not applicable, instead
    of leaving the field blank, leave this field out of the object. Clearable in overlays.
  error_then: =must-ignore
  type: xs:integer
- _name: Type
  csv-header-name: type
  csv-type: DistrictType
  description: Specifies the type of electoral area (e.g. state, congressional, state-senate,
    county, school) from :ref:`$$$-district-type`. Required in main feed; optional
    in overlays.
  required: true
  type: DistrictType
- _name: OtherType
  csv-header-name: other_type
  csv-type: xs:string
  description: Custom district type if Type is "other". Clearable in overlays.
  error_then: =must-ignore
  type: xs:string
