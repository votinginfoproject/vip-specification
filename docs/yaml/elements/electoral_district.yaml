_name: ElectoralDistrict
csv-header-name: electoral_district
csv-post: |-
  .. code-block:: csv-table
     :linenos:

      id,name,number,type,other_type
      ed60129,57th House of Delegates District,57,state-house,
description: |-
  An ElectoralDistrict represents a geographic boundary or jurisdiction for representation, contests, and offices.

  In overlay feeds, clearable fields can be cleared using ``<Clear{FieldName}/>`` (e.g. ``<ClearNumber/>``, ``<ClearExternalIdentifier/>``). Name and Type are optional in overlays.
post: |-
  .. code-block:: xml
     :linenos:

     <ElectoralDistrict id="ed60129">
        <ExternalIdentifier>
           <Type>ocd-id</Type>
           <Value>ocd-division/country:us/state:va/sldl:57</Value>
        </ExternalIdentifier>
        <Name>
           <Text language="en">Virginia's 57th House of Delegates district</Text>
        </Name>
        <Number>57</Number>
        <Type>state-house</Type>
     </ElectoralDistrict>
tags:
- _name: ExternalIdentifier
  csv-header-name: external_identifier
  csv-type: ExternalIdentifier
  description: External identifier(s) linking this district to other datasets (e.g.
    OCD-ID). Clearable in overlays.
  error_then: =must-ignore
  repeating: true
  type: ExternalIdentifier
- _name: Name
  csv-header-name: name
  csv-type: InternationalizedText
  description: Name of the district. Required in main feed; optional in overlays.
  required: true
  type: InternationalizedText
- _name: Number
  csv-header-name: number
  csv-type: xs:integer
  description: Number of the district (e.g. "57"). Clearable in overlays.
  error_then: =must-ignore
  type: xs:integer
- _name: Type
  csv-header-name: type
  csv-type: DistrictType
  description: Type of district from :ref:`$$$-district-type`. Required in main feed;
    optional in overlays.
  required: true
  type: DistrictType
- _name: OtherType
  csv-header-name: other_type
  csv-type: xs:string
  description: Custom district type if Type is "other". Clearable in overlays.
  error_then: =must-ignore
  type: xs:string
