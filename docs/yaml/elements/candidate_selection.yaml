_name: CandidateSelection
csv-header-name: candidate_selection
csv-post: |-
  .. code-block:: csv-table
     :linenos:

      id,sequence_order,candidate_ids,endorsement_party_ids,is_write_in
      cs001,1,can001,par01,false
      cs002,2,can002,par02,false
description: CandidateSelection extends :ref:`$$$-ballot-selection-base` and represents
  a ballot selection for one or more candidates in a candidate contest.
extends:
- BallotSelectionBase
post: |-
  .. code-block:: xml
     :linenos:

     <CandidateSelection id="cs10861">
        <CandidateIds>can10861a can10861b</CandidateIds>
        <EndorsementPartyIds>par0001</EndorsementPartyIds>
     </CandidateSelection>
tags:
- _name: CandidateIds
  csv-header-name: candidate_ids
  csv-type: xs:IDREFS
  description: References :ref:`$$$-candidate` elements that comprise this selection
    (e.g. candidate and running mate).
  error: If CandidateIds is invalid or not present, the implementation is required
    to ignore the CandidateSelection containing it.
  required: true
  type: xs:IDREFS
- _name: EndorsementPartyIds
  csv-header-name: endorsement_party_ids
  csv-type: xs:IDREFS
  description: References :ref:`$$$-party` elements endorsing this candidate selection.
  error_then: =must-ignore
  type: xs:IDREFS
- _name: IsWriteIn
  csv-header-name: is_write_in
  csv-type: xs:boolean
  description: Signifies whether this selection represents a write-in line.
  error_then: =must-ignore
  type: xs:boolean
