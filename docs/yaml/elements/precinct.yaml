_name: Precinct
_sub_types:
- SpatialBoundary
csv-header-name: precinct
csv-post: |-
  .. code-block:: csv-table
     :linenos:

      id,ballot_style_id,electoral_district_ids,is_mail_only,locality_id,name,number,polling_location_ids,precinct_split_name,ward
      pre90111,bs00010,ed001 ed002,false,loc70001,203 - GEORGETOWN,0203,pl00001,split13,5
description: |-
  The Precinct object represents a voting precinct or precinct split within a Locality.

  In overlay feeds, clearable fields can be cleared using ``<Clear{FieldName}/>`` (e.g. ``<ClearBallotStyleId/>``, ``<ClearPollingLocationIds/>``, ``<ClearIsInactive/>``). LocalityId and Name are optional in overlays. EmergencyNotice is permitted only in overlays.
post: |-
  .. code-block:: xml
     :linenos:

     <Precinct id="pre90111">
        <BallotStyleId>bs00010</BallotStyleId>
        <ElectoralDistrictIds>ed60129 ed60311</ElectoralDistrictIds>
        <IsMailOnly>false</IsMailOnly>
        <LocalityId>loc70001</LocalityId>
        <Name>203 - GEORGETOWN</Name>
        <Number>0203</Number>
        <PollingLocationIds>pl00001</PollingLocationIds>
     </Precinct>
tags:
- _name: BallotStyleId
  csv-header-name: ballot_style_id
  csv-type: xs:IDREF
  description: Links to the :ref:`$$$-ballot-style` voted by electors in this precinct.
    Clearable in overlays.
  error_then: =must-ignore
  type: xs:IDREF
- _name: ElectoralDistrictIds
  csv-header-name: electoral_district_ids
  csv-type: xs:IDREFS
  description: Links to the :ref:`$$$-electoral-district`s (e.g., congressional district,
    state house district, school board district) to which the entire precinct/precinct
    split belongs. Highly Recommended if candidate information is to be provided.
    Clearable in overlays.
  error_then: =must-ignore
  type: xs:IDREFS
- _name: ExternalIdentifier
  csv-header-name: external_identifier
  csv-type: ExternalIdentifier
  description: External identifier(s) linking this precinct to other datasets (e.g.
    OCD-ID). Clearable in overlays.
  error_then: =must-ignore
  repeating: true
  type: ExternalIdentifier
- _name: IsMailOnly
  csv-header-name: is_mail_only
  csv-type: xs:boolean
  description: Specifies if this precinct conducts mail-only elections. Clearable
    in overlays.
  error: If the field is missing or invalid, the implementation is required to assume
    IsMailOnly is false.
  type: xs:boolean
- _name: LocalityId
  csv-header-name: locality_id
  csv-type: xs:IDREF
  description: References the containing :ref:`$$$-locality`. Required in main feed;
    optional in overlays.
  error: If LocalityId is invalid or not present, the implementation is required to
    ignore the Precinct containing it.
  required: true
  type: xs:IDREF
- _name: Name
  csv-header-name: name
  csv-type: xs:string
  description: Name of the precinct. Required in main feed; optional in overlays.
  error: If Name is invalid or not present, the implementation is required to ignore
    the Precinct containing it.
  required: true
  type: xs:string
- _name: Number
  csv-header-name: number
  csv-type: xs:string
  description: Specifies the precinct's number (e.g., 32 or 32A -- alpha characters
    are legal). Should be used if the Name field is populated by a name and not a
    number. Clearable in overlays.
  error_then: =must-ignore
  type: xs:string
- _name: PollingLocationIds
  csv-header-name: polling_location_ids
  csv-type: xs:IDREFS
  description: Links to polling locations serving this precinct. Clearable in overlays.
  error_then: =must-ignore
  type: xs:IDREFS
- _name: PrecinctSplitName
  csv-header-name: precinct_split_name
  csv-type: xs:string
  description: If this field is empty, then this Precinct object represents a full
    precinct. If this field is present, then this Precinct object represents one portion
    of a split precinct. Each Precinct object that represents one portion of a split
    precinct must have the same Name value, but different PrecinctSplitName values
    (e.g. "Split A", "Split B"). See the sample_feed.xml file for examples. Clearable
    in overlays.
  error_then: =must-ignore
  type: xs:string
- _name: SpatialBoundary
  csv-header-name: spatial_boundary
  csv-type: SpatialBoundary
  description: Defines the spatial boundary of the precinct. All voter addresses contained
    within this boundary are assigned to the precinct. If a voter address also maps
    to a :doc:`StreetSegment <street_segment>`, then the precinct assignment from
    the StreetSegment will be preferred over the assignment defined by the spatial
    boundary. Clearable in overlays.
  error_then: =must-ignore
  type: SpatialBoundary
- _name: Ward
  csv-header-name: ward
  csv-type: xs:string
  description: Ward identifier if applicable. Clearable in overlays.
  error_then: =must-ignore
  type: xs:string
- _name: EmergencyNotice
  csv-header-name: emergency_notice
  csv-type: EmergencyNotice
  description: Emergency notice specific to this precinct. Permitted only in feed
    overlays.
  error_then: =must-ignore
  repeating: true
  skip_on: csv
  type: EmergencyNotice
- _name: IsInactive
  csv-header-name: is_inactive
  csv-type: xs:string
  description: If specified, marks the precinct as inactive, stating the reason why.
    Clearable in overlays.
  error_then: =must-ignore
  type: xs:string
