_name: SimpleAddressType
csv-header-name: simple_address_type
description: |-
  A ``SimpleAddressType`` represents a structured physical or mailing address. It has an optional attribute, ``language``, which defaults to ``i-default``.

  When multiple ``SimpleAddressType`` elements are provided on an entity (such as ``AddressStructured`` on a polling location, or ``MailingAddress`` / ``PhysicalAddress`` on contact information), each must have a distinct ``language`` attribute to specify the address in multiple languages.
post: |-
  .. code-block:: xml
     :linenos:

     <AddressStructured language="en">
        <LocationName>Albemarle High School</LocationName>
        <AddressLine>2775 Hydraulic Rd</AddressLine>
        <City>Charlottesville</City>
        <County>Albemarle</County>
        <Region>VA</Region>
        <Country>USA</Country>
        <PostalCode>22901</PostalCode>
     </AddressStructured>
tags:
- _name: LocationName
  csv-header-name: location_name
  csv-type: xs:string
  description: The name of the location or facility (e.g. "Albemarle High School").
  error_then: =must-ignore
  type: xs:string
- _name: AddressLine
  csv-header-name: address_line
  csv-type: xs:string
  description: Street address line(s). Multiple AddressLine tags may appear in order
    (e.g. street address, suite/room).
  error: If no AddressLine is provided, the implementation should ignore the SimpleAddressType
    containing it.
  repeating: true
  required: true
  type: xs:string
- _name: City
  csv-header-name: city
  csv-type: xs:string
  description: The city, town, or municipality.
  error_then: =must-ignore
  type: xs:string
- _name: County
  csv-header-name: county
  csv-type: xs:string
  description: The county or parish.
  error_then: =must-ignore
  type: xs:string
- _name: Region
  csv-header-name: region
  csv-type: xs:string
  description: The state, province, or primary sub-national region (e.g. "VA").
  error_then: =must-ignore
  type: xs:string
- _name: Country
  csv-header-name: country
  csv-type: xs:string
  description: The country (e.g. "USA").
  error_then: =must-ignore
  type: xs:string
- _name: WorldRegion
  csv-header-name: world_region
  csv-type: xs:string
  description: Global or continental region if applicable.
  error_then: =must-ignore
  type: xs:string
- _name: PostalCode
  csv-header-name: postal_code
  csv-type: xs:string
  description: The postal code or ZIP code.
  error_then: =must-ignore
  type: xs:string
