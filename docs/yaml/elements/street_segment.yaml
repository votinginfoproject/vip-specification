_name: StreetSegment
csv-header-name: street_segment
csv-post: |-
  .. code-block:: csv-table
     :linenos:

      id,address_direction,city,includes_all_addresses,includes_all_streets,odd_even_both,precinct_id,start_house_number,end_house_number,house_number_prefix,house_number_suffix,region,country,street_direction,street_name,street_suffix,unit_number,postal_code
      ss000001,N,Washington,false,false,odd,pre90113,101,199,,,DC,USA,NW,Delaware,St,,20001
      ss000002,S,Washington,true,false,both,pre90112,,,,,DC,USA,SE,Wisconsin,Ave,,20002
description: A StreetSegment object represents a range of house numbers along a street
  and links them to the containing :ref:`$$$-precinct`. Street segments are excluded
  from feed overlays.
post: |-
  .. code-block:: xml
     :linenos:

     <StreetSegment id="ss999999">
        <City>Charlottesville</City>
        <IncludesAllAddresses>true</IncludesAllAddresses>
        <OddEvenBoth>both</OddEvenBoth>
        <PrecinctId>pre99999</PrecinctId>
        <Region>VA</Region>
        <Country>USA</Country>
        <StreetName>CHAPEL HILL</StreetName>
        <StreetSuffix>RD</StreetSuffix>
        <PostalCode>22901</PostalCode>
     </StreetSegment>
tags:
- _name: AddressDirection
  csv-header-name: address_direction
  csv-type: xs:string
  description: Specifies the (inter-)cardinal direction of the entire address. An
    example is "NE" for the address "100 E Capitol St NE."
  error_then: =must-ignore
  type: xs:string
- _name: City
  csv-header-name: city
  csv-type: xs:string
  description: The city specifies the city or town of the address (e.g. "Richmond",
    "Springfield").
  required: true
  type: xs:string
- _name: IncludesAllAddresses
  csv-header-name: includes_all_addresses
  csv-type: xs:boolean
  description: Specifies if the segment covers every address on this street. If this
    is true, then the values of StartHouseNumber and EndHouseNumber should be ignored.
    The value of OddEvenBoth must be "both".
  error_then: =must-ignore
  type: xs:boolean
- _name: IncludesAllStreets
  csv-header-name: includes_all_streets
  csv-type: xs:boolean
  description: Specifies if the segment covers every street in this city. If this
    is true, then the values of OddEvenBoth, StartHouseNumber, EndHouseNumber, StreetName,
    and PostalCode should be ignored.
  error_then: =must-ignore
  type: xs:boolean
- _name: OddEvenBoth
  csv-header-name: odd_even_both
  csv-type: OebEnum
  description: Specifies whether the odd side of the street (in terms of house numbers),
    the even side, or both are included in the street segment from :ref:`$$$-oeb-enum`.
  error: If OddEvenBoth is missing or invalid, the implementation is required to ignore
    the StreetSegment containing it.
  required: true
  type: OebEnum
- _name: PrecinctId
  csv-header-name: precinct_id
  csv-type: xs:IDREF
  description: References the :ref:`$$$-precinct` that contains the entire street
    segment. If a precinct has a :ref:`$$$-spatial-boundary` which also contains the
    entire street segment, then the precinct assignment from the segment will be preferred
    over the assignment defined by the spatial boundary.
  required: true
  type: xs:IDREF
- _name: StartHouseNumber
  csv-header-name: start_house_number
  csv-type: xs:integer
  description: The house number at which the street segment starts (e.g. 100). This
    value is necessary for the street segment to make any sense. Unless IncludesAllAddresses
    or IncludesAllStreets are true, this value must be less than or equal to EndHouseNumber.
    If IncludesAllAddresses or IncludesAllStreets are true, this value is ignored.
  error_then: =must-ignore
  type: xs:integer
- _name: EndHouseNumber
  csv-header-name: end_house_number
  csv-type: xs:integer
  description: The house number at which the street segment ends (e.g. 198). This
    value is necessary for the street segment to make any sense. Unless IncludesAllAddresses
    or IncludesAllStreets are true, it must be greater than or equal to StartHouseNumber.
    If IncludesAllAddresses or IncludesAllStreets are true, this value is ignored.
  error_then: =must-ignore
  type: xs:integer
- _name: HouseNumberPrefix
  csv-header-name: house_number_prefix
  csv-type: xs:string
  description: Part of a street address. It may contain letters or slashes (e.g.,
    'B' in 'B22 Main St'). If this value is present then StartHouseNumber must be
    equal to EndHouseNumber. This field cannot be used if IncludesAllAddresses or
    IncludesAllStreets are true.
  error_then: =must-ignore
  type: xs:string
- _name: HouseNumberSuffix
  csv-header-name: house_number_suffix
  csv-type: xs:string
  description: Part of a street address. It may contain letters or slashes (e.g.,
    1/2 in '22 1/2 Main St'). If this value is present then StartHouseNumber must
    be equal to EndHouseNumber. This field cannot be used if IncludesAllAddresses
    or IncludesAllStreets are true.
  error_then: =must-ignore
  type: xs:string
- _name: Region
  csv-header-name: region
  csv-type: xs:string
  description: State, province, or primary sub-national region (e.g. "VA").
  required: true
  type: xs:string
- _name: Country
  csv-header-name: country
  csv-type: xs:string
  description: Country code or name (e.g. "USA").
  error_then: =must-ignore
  type: xs:string
- _name: StreetDirection
  csv-header-name: street_direction
  csv-type: xs:string
  description: Specifies the (inter-)cardinal direction of the street address (e.g.,
    the "E" in "100 E Capitol St NE").
  error_then: =must-ignore
  type: xs:string
- _name: StreetName
  csv-header-name: street_name
  csv-type: xs:string
  description: Represents the name of the street for the address. A special wildcard,
    "*", denotes every street in the given city/town. It optionally may contain street
    direction, street suffix or address direction (e.g., both "Capitol" and "E Capitol
    St NE" are acceptable for the address "100 E Capitol St NE"), however this is
    not preferred. Preferred is street name alone (e.g. "Capitol").
  error_then: =must-ignore
  type: xs:string
- _name: StreetSuffix
  csv-header-name: street_suffix
  csv-type: xs:string
  description: Represents the abbreviated, non-directional suffix to the street name.
    An example is "St" for the address "100 E Capitol St NE", or "Ave", "Rd", "Blvd".
  error_then: =must-ignore
  type: xs:string
- _name: UnitNumber
  csv-header-name: unit_number
  csv-type: xs:string
  description: The apartment/unit number for a street segment (e.g. "Apt 3B"). If
    this value is present then StartHouseNumber must be equal to EndHouseNumber. This
    field cannot be used if IncludesAllAddresses or IncludesAllStreets are true.
  error_then: =must-ignore
  repeating: true
  type: xs:string
- _name: PostalCode
  csv-header-name: postal_code
  csv-type: xs:string
  description: Specifies the postal or ZIP code of the address (e.g. "22902" or "22902-1234").
  error_then: =must-ignore
  type: xs:string
