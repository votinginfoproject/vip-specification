_name: StreetSegment
csv-header-name: street_segment
csv-post: |-
  .. code-block:: csv-table
     :linenos:

      id,address_direction,city,includes_all_addresses,includes_all_streets,odd_even_both,precinct_id,start_house_number,end_house_number,house_number_prefix,house_number_suffix,region,country,street_direction,street_name,street_suffix,unit_number,postal_code
      ss000001,N,Washington,false,false,odd,pre90113,101,199,,,DC,USA,NW,Delaware,St,,20001
      ss000002,S,Washington,true,false,both,pre90112,,,,,DC,USA,SE,Wisconsin,Ave,,20002
description: A StreetSegment object represents a range of house numbers along a street
  and links them to the containing :ref:`$$$-precinct`. Street segments are excluded
  from feed overlays.
post: |-
  .. code-block:: xml
     :linenos:

     <StreetSegment id="ss999999">
        <City>Charlottesville</City>
        <IncludesAllAddresses>true</IncludesAllAddresses>
        <OddEvenBoth>both</OddEvenBoth>
        <PrecinctId>pre99999</PrecinctId>
        <Region>VA</Region>
        <Country>USA</Country>
        <StreetName>CHAPEL HILL</StreetName>
        <StreetSuffix>RD</StreetSuffix>
        <PostalCode>22901</PostalCode>
     </StreetSegment>
tags:
- _name: AddressDirection
  csv-header-name: address_direction
  csv-type: xs:string
  description: Specifies trailing directional component of the address (e.g. "NE").
  error_then: =must-ignore
  type: xs:string
- _name: City
  csv-header-name: city
  csv-type: xs:string
  description: City or municipality name.
  required: true
  type: xs:string
- _name: IncludesAllAddresses
  csv-header-name: includes_all_addresses
  csv-type: xs:boolean
  description: If true, the segment covers all addresses on this street. OddEvenBoth
    must be "both".
  error_then: =must-ignore
  type: xs:boolean
- _name: IncludesAllStreets
  csv-header-name: includes_all_streets
  csv-type: xs:boolean
  description: If true, covers all streets in the city.
  error_then: =must-ignore
  type: xs:boolean
- _name: OddEvenBoth
  csv-header-name: odd_even_both
  csv-type: OebEnum
  description: Specifies whether odd, even, or both sides of the street are included
    from :ref:`$$$-oeb-enum`.
  error: If OddEvenBoth is missing or invalid, the implementation is required to ignore
    the StreetSegment containing it.
  required: true
  type: OebEnum
- _name: PrecinctId
  csv-header-name: precinct_id
  csv-type: xs:IDREF
  description: References the containing :ref:`$$$-precinct`.
  required: true
  type: xs:IDREF
- _name: StartHouseNumber
  csv-header-name: start_house_number
  csv-type: xs:integer
  description: Starting house number for the segment range.
  error_then: =must-ignore
  type: xs:integer
- _name: EndHouseNumber
  csv-header-name: end_house_number
  csv-type: xs:integer
  description: Ending house number for the segment range.
  error_then: =must-ignore
  type: xs:integer
- _name: HouseNumberPrefix
  csv-header-name: house_number_prefix
  csv-type: xs:string
  description: Prefix to the house number if any.
  error_then: =must-ignore
  type: xs:string
- _name: HouseNumberSuffix
  csv-header-name: house_number_suffix
  csv-type: xs:string
  description: Suffix to the house number if any.
  error_then: =must-ignore
  type: xs:string
- _name: Region
  csv-header-name: region
  csv-type: xs:string
  description: State, province, or primary sub-national region (e.g. "VA").
  required: true
  type: xs:string
- _name: Country
  csv-header-name: country
  csv-type: xs:string
  description: Country code or name (e.g. "USA").
  error_then: =must-ignore
  type: xs:string
- _name: StreetDirection
  csv-header-name: street_direction
  csv-type: xs:string
  description: Leading directional prefix for the street (e.g. "N", "NW").
  error_then: =must-ignore
  type: xs:string
- _name: StreetName
  csv-header-name: street_name
  csv-type: xs:string
  description: Street name.
  error_then: =must-ignore
  type: xs:string
- _name: StreetSuffix
  csv-header-name: street_suffix
  csv-type: xs:string
  description: Street type suffix (e.g. "St", "Ave", "Rd").
  error_then: =must-ignore
  type: xs:string
- _name: UnitNumber
  csv-header-name: unit_number
  csv-type: xs:string
  description: Unit, apartment, or suite number(s).
  error_then: =must-ignore
  repeating: true
  type: xs:string
- _name: PostalCode
  csv-header-name: postal_code
  csv-type: xs:string
  description: Postal code or ZIP code.
  error_then: =must-ignore
  type: xs:string
