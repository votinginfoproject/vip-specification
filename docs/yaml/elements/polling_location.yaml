_name: PollingLocation
csv-header-name: polling_location
csv-post: |-
  .. code-block:: csv-table
     :linenos:

      id,location_type,directions,photo_uri,party_ids,is_inactive
      poll001,InPersonDayOf,Use gymnasium entrance,https://example.gov/poll.jpg,,
      poll002,DropOff,Curbside ballot drop box,,,Water main break
description: |-
  The PollingLocation object represents a site where voters cast ballots in person or drop off early/absentee ballots. In VIP 7.0, facility names are placed in ``AddressStructured.LocationName``.

  In overlay feeds, clearable fields can be cleared using ``<Clear{FieldName}/>`` (e.g. ``<ClearSchedule/>``, ``<ClearDirections/>``, ``<ClearPhotoUri/>``, ``<ClearIsInactive/>``). AddressStructured and LocationType are optional in overlays.
  EmergencyNotice is permitted only in overlays.
  In overlays, PollingLocation has an optional attribute ``isNew="true"`` to indicate that a polling location is newly added rather than modifying an existing one.
post: |-
  .. code-block:: xml
     :linenos:

     <PollingLocation id="pl00001">
        <AddressStructured language="en">
           <LocationName>ALBEMARLE HIGH SCHOOL</LocationName>
           <AddressLine>2775 Hydraulic Rd</AddressLine>
           <City>CHARLOTTESVILLE</City>
           <Region>VA</Region>
           <PostalCode>22901</PostalCode>
        </AddressStructured>
        <LocationIdentifier provider="google" relativePriority="1.0">
           <Type>pluscode</Type>
           <Value>87G83W52+4F</Value>
        </LocationIdentifier>
        <LocationType>InPersonDayOf</LocationType>
        <Directions>
           <Text language="en">Use gymnasium entrance on east side.</Text>
        </Directions>
        <Schedule>
           <TimeZone>America/New_York</TimeZone>
           <StartDate>2024-11-05</StartDate>
           <EndDate>2024-11-05</EndDate>
           <Hours>
              <StartTime>06:00:00</StartTime>
              <EndTime>19:00:00</EndTime>
           </Hours>
        </Schedule>
        <LatLng>
           <Latitude>38.0754627</Latitude>
           <Longitude>-78.5014875</Longitude>
        </LatLng>
     </PollingLocation>
tags:
- _name: AddressStructured
  csv-header-name: address_structured
  csv-type: SimpleAddressType
  description: Structured address including facility name. Required in main feed;
    optional in overlays. Multiple addresses in different languages can be specified.
  error: AddressStructured is required for PollingLocation in main feeds.
  repeating: true
  required: true
  type: SimpleAddressType
- _name: LocationIdentifier
  csv-header-name: location_identifier
  csv-type: LocationIdentifier
  description: External location identifier(s) (e.g. Plus Code, geocoder ID). Clearable
    in overlays.
  error_then: =must-ignore
  repeating: true
  type: LocationIdentifier
- _name: Directions
  csv-header-name: directions
  csv-type: InternationalizedText
  description: Instructions for locating the polling site or room. Clearable in overlays.
  error_then: =must-ignore
  type: InternationalizedText
- _name: Hours
  csv-header-name: hours
  csv-type: InternationalizedText
  description: 'Operating hours as text. Clearable in overlays. *(NB: deprecated in
    favor of :ref:`$$$-schedule-with-timezone`)*.'
  error_then: =must-ignore
  type: InternationalizedText
- _name: Schedule
  csv-header-name: schedule
  csv-type: ScheduleWithTimezone
  description: Structured schedule of operating dates and hours. Clearable in overlays.
  error_then: =must-ignore
  repeating: true
  type: ScheduleWithTimezone
- _name: LocationType
  csv-header-name: location_type
  csv-type: PollingLocationType
  description: The type of voting conducted at this location (InPersonDayOf, InPersonEarly,
    or DropOff). Required in main feed; optional in overlays.
  error: LocationType is required for PollingLocation in main feeds.
  required: true
  type: PollingLocationType
- _name: LatLng
  csv-header-name: lat_lng
  csv-type: LatLng
  description: Latitude and longitude coordinates. Clearable in overlays.
  error_then: =must-ignore
  type: LatLng
- _name: PartyIds
  csv-header-name: party_ids
  csv-type: xs:IDREFS
  description: If present, indicates which parties' primaries occur at this location.
    Clearable in overlays.
  error_then: =must-ignore
  type: xs:IDREFS
- _name: PhotoUri
  csv-header-name: photo_uri
  csv-type: InternationalizedUri
  description: Link to a photo of the location. Clearable in overlays.
  error_then: =must-ignore
  type: InternationalizedUri
- _name: EmergencyNotice
  csv-header-name: emergency_notice
  csv-type: EmergencyNotice
  description: Emergency notice specific to this polling location. Permitted only
    in feed overlays.
  error_then: =must-ignore
  repeating: true
  skip_on: csv
  type: EmergencyNotice
- _name: IsInactive
  csv-header-name: is_inactive
  csv-type: xs:string
  description: If specified, marks the location as closed or inactive, with the text
    stating the reason why. Clearable in overlays.
  error_then: =must-ignore
  type: xs:string
