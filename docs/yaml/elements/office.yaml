_name: Office
_sub_types:
- Term
csv-header-name: office
csv-post: |-
  .. code-block:: csv-table
     :linenos:

      id,electoral_district_id,filing_deadline,is_partisan,name,office_holder_person_ids,term_type,term_start_date,term_end_date
      off001,ed001,2024-06-01,true,Governor,per50001,full-term,2022-01-15,2026-01-15
description: '``Office`` represents the office associated with a contest or district
  (e.g. Alderman, Mayor, Governor, School Board, et al).'
tags:
- _name: ContactInformation
  csv-header-name: contact_information
  csv-type: ContactInformation
  description: Contact information for the office.
  error_then: =must-ignore
  repeating: true
  type: ContactInformation
- _name: Description
  csv-header-name: description
  csv-type: InternationalizedText
  description: Brief description of the office and its responsibilities.
  error_then: =must-ignore
  type: InternationalizedText
- _name: ElectoralDistrictId
  csv-header-name: electoral_district_id
  csv-type: xs:IDREF
  description: Links to the :ref:`$$$-electoral-district` representing the geographical
    scope of the office.
  error: If ElectoralDistrictId is invalid or not present, the implementation is required
    to ignore the Office containing it.
  required: true
  type: xs:IDREF
- _name: ExternalIdentifier
  csv-header-name: external_identifier
  csv-type: ExternalIdentifier
  description: External identifier(s) linking this office to external systems (e.g.
    OCD-ID).
  error_then: =must-ignore
  repeating: true
  type: ExternalIdentifier
- _name: FilingDeadline
  csv-header-name: filing_deadline
  csv-type: xs:date
  description: Filing deadline date for candidates running for this office.
  error_then: =must-ignore
  type: xs:date
- _name: IsPartisan
  csv-header-name: is_partisan
  csv-type: xs:boolean
  description: Indicates whether the office is partisan.
  error_then: =must-ignore
  type: xs:boolean
- _name: Name
  csv-header-name: name
  csv-type: InternationalizedText
  description: Official name of the office.
  error: If Name is invalid or not present, the implementation is required to ignore
    the Office containing it.
  required: true
  type: InternationalizedText
- _name: OfficeHolderPersonIds
  csv-header-name: office_holder_person_ids
  csv-type: xs:IDREFS
  description: References to :ref:`$$$-person` elements for the current office holder(s).
  error_then: =must-ignore
  type: xs:IDREFS
- _name: Term
  csv-header-name: term
  csv-type: Term
  description: Defines the term length and dates of the office.
  error_then: =must-ignore
  type: Term
