_name: Party
csv-header-name: party
csv-post: |-
  .. code-block:: csv-table
     :linenos:

      id,abbreviation,color,is_write_in,leader_person_ids,logo_uri,name
      par0001,DEM,0000FF,false,per50001,https://example.gov/dem.png,Democratic Party
      par0002,REP,FF0000,false,per50002,https://example.gov/rep.png,Republican Party
description: The Party object represents a political party or ballot grouping.
post: |-
  .. code-block:: xml
     :linenos:

     <Party id="par0001">
        <Abbreviation>DEM</Abbreviation>
        <Color>0000FF</Color>
        <Name>
           <Text language="en">Democratic Party</Text>
           <Text language="es">Partido Demócrata</Text>
        </Name>
     </Party>
tags:
- _name: Abbreviation
  csv-header-name: abbreviation
  csv-type: xs:string
  description: Abbreviation for the party name (e.g. "DEM", "REP").
  error_then: =must-ignore
  type: xs:string
- _name: Color
  csv-header-name: color
  csv-type: HtmlColorString
  description: Six-digit hexadecimal HTML color code associated with the party.
  error_then: =must-ignore
  type: HtmlColorString
- _name: ExternalIdentifier
  csv-header-name: external_identifier
  csv-type: ExternalIdentifier
  description: External identifier(s) linking this party to other datasets.
  error_then: =must-ignore
  repeating: true
  type: ExternalIdentifier
- _name: IsWriteIn
  csv-header-name: is_write_in
  csv-type: xs:boolean
  description: Indicates if the party represents write-in selections.
  error_then: =must-ignore
  type: xs:boolean
- _name: LeaderPersonIds
  csv-header-name: leader_person_ids
  csv-type: xs:IDREFS
  description: References to :ref:`$$$-person` elements for party leadership.
  error_then: =must-ignore
  type: xs:IDREFS
- _name: LogoUri
  csv-header-name: logo_uri
  csv-type: InternationalizedUri
  description: URI pointing to the party logo.
  error_then: =must-ignore
  type: InternationalizedUri
- _name: Name
  csv-header-name: name
  csv-type: InternationalizedText
  description: Official name of the party.
  required: true
  type: InternationalizedText
