_name: Party
csv-header-name: party
csv-post: |-
  .. code-block:: csv-table
     :linenos:

      id,abbreviation,color,is_write_in,leader_person_ids,logo_uri,name
      par0001,DEM,0000FF,false,per50001,https://example.gov/dem.png,Democratic Party
      par0002,REP,FF0000,false,per50002,https://example.gov/rep.png,Republican Party
description: This element describes a political party and the metadata associated
  with it. These can also include "dummy" parties to indicate a type of contest (e.g.,
  a Voter Nominated candidate contest can use the PrimaryPartyIds field and a dummy
  Party object to indicate that the contest is a "Top-Two" primary).
post: |-
  .. code-block:: xml
     :linenos:

     <Party id="par0001">
        <Abbreviation>DEM</Abbreviation>
        <Color>0000FF</Color>
        <Name>
           <Text language="en">Democratic Party</Text>
           <Text language="es">Partido Demócrata</Text>
        </Name>
     </Party>
tags:
- _name: Abbreviation
  csv-header-name: abbreviation
  csv-type: xs:string
  description: An abbreviation for the party name (e.g. "DEM", "REP", "LIB", "GRN").
  error_then: =must-ignore
  type: xs:string
- _name: Color
  csv-header-name: color
  csv-type: HtmlColorString
  description: The preferred display color for the party, for use in maps and other
    displays, as a 6-character hexadecimal HTML color code (e.g. "0000FF" for blue,
    "FF0000" for red).
  error_then: =must-ignore
  type: HtmlColorString
- _name: ExternalIdentifier
  csv-header-name: external_identifier
  csv-type: ExternalIdentifier
  description: External identifier(s) linking this party to other datasets.
  error_then: =must-ignore
  repeating: true
  type: ExternalIdentifier
- _name: IsWriteIn
  csv-header-name: is_write_in
  csv-type: xs:boolean
  description: Signals if this political party is one that is officially recognized
    by a local, state, or federal organization, or represents a "write-in" in jurisdictions
    which allow candidates to free-form enter their political affiliation.
  error_then: =must-ignore
  type: xs:boolean
- _name: LeaderPersonIds
  csv-header-name: leader_person_ids
  csv-type: xs:IDREFS
  description: References to :ref:`$$$-person` elements for party leadership.
  error_then: =must-ignore
  type: xs:IDREFS
- _name: LogoUri
  csv-header-name: logo_uri
  csv-type: InternationalizedUri
  description: URI pointing to the party logo.
  error_then: =must-ignore
  type: InternationalizedUri
- _name: Name
  csv-header-name: name
  csv-type: InternationalizedText
  description: Official name of the party.
  required: true
  type: InternationalizedText
