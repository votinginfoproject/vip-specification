_name: Person
csv-header-name: person
csv-post: |-
  .. code-block:: csv-table
     :linenos:

      id,first_name,last_name,middle_name,nickname,prefix,suffix,title,profession,party_id,date_of_birth,gender
      per50001,Ken,Cuccinelli,T.,,II,,Attorney General,Attorney,par0001,1968-07-30,male
description: |-
  The Person object represents an individual (such as a candidate, election official, or party leader).

  In overlay feeds, clearable fields can be cleared using ``<Clear{FieldName}/>`` (e.g. ``<ClearContactInformation/>``, ``<ClearPartyId/>``, ``<ClearProfession/>``).
post: |-
  .. code-block:: xml
     :linenos:

     <Person id="per10961">
        <ContactInformation>
           <Email>ken@example.com</Email>
           <Phone>804-555-0100</Phone>
        </ContactInformation>
        <FirstName>Ken</FirstName>
        <FullName>
           <Text language="en">Ken T. Cuccinelli II</Text>
        </FullName>
        <Gender>male</Gender>
        <LastName>Cuccinelli</LastName>
        <MiddleName>T.</MiddleName>
        <PartyId>par0001</PartyId>
        <Suffix>II</Suffix>
        <Title>
           <Text language="en">Attorney General</Text>
        </Title>
     </Person>
tags:
- _name: ContactInformation
  csv-header-name: contact_information
  csv-type: ContactInformation
  description: Contact information for the person. Clearable in overlays.
  error_then: =must-ignore
  repeating: true
  type: ContactInformation
- _name: DateOfBirth
  csv-header-name: date_of_birth
  csv-type: xs:date
  description: Date of birth of the person. Clearable in overlays.
  error_then: =must-ignore
  type: xs:date
- _name: ExternalIdentifier
  csv-header-name: external_identifier
  csv-type: ExternalIdentifier
  description: External identifier(s) linking this person to external systems. Clearable
    in overlays.
  error_then: =must-ignore
  repeating: true
  type: ExternalIdentifier
- _name: FirstName
  csv-header-name: first_name
  csv-type: xs:string
  description: First name of the person. Clearable in overlays.
  error_then: =must-ignore
  type: xs:string
- _name: FullName
  csv-header-name: full_name
  csv-type: InternationalizedText
  description: Full legal or preferred name of the person. Clearable in overlays.
  error_then: =must-ignore
  type: InternationalizedText
- _name: Gender
  csv-header-name: gender
  csv-type: xs:string
  description: Gender of the person. Clearable in overlays.
  error_then: =must-ignore
  type: xs:string
- _name: LastName
  csv-header-name: last_name
  csv-type: xs:string
  description: Last name of the person. Clearable in overlays.
  error_then: =must-ignore
  type: xs:string
- _name: MiddleName
  csv-header-name: middle_name
  csv-type: xs:string
  description: Represents any number of names between an individual's first and last
    names (e.g. John **Ronald Reuel** Tolkien). Clearable in overlays.
  error_then: =must-ignore
  repeating: true
  type: xs:string
- _name: Nickname
  csv-header-name: nickname
  csv-type: xs:string
  description: Represents an individual's nickname (e.g. "Bill" for William). Clearable
    in overlays.
  error_then: =must-ignore
  type: xs:string
- _name: PartyId
  csv-header-name: party_id
  csv-type: xs:IDREF
  description: Refers to the associated :ref:`$$$-party`. This information is intended
    to be used by feed consumers to help them disambiguate the person's identity,
    but not to be presented as part of ballot information (for that see :ref:`$$$-candidate`
    PartyId). Clearable in overlays.
  error_then: =must-ignore
  type: xs:IDREF
- _name: Prefix
  csv-header-name: prefix
  csv-type: xs:string
  description: Specifies a prefix associated with a person (e.g. "Dr.", "Rev.", "Hon.").
    Clearable in overlays.
  error_then: =must-ignore
  type: xs:string
- _name: Profession
  csv-header-name: profession
  csv-type: InternationalizedText
  description: Occupation or profession of the person. Clearable in overlays.
  error_then: =must-ignore
  type: InternationalizedText
- _name: Suffix
  csv-header-name: suffix
  csv-type: xs:string
  description: Specifies a suffix associated with a person (e.g. "Jr.", "III", "Esq.").
    Clearable in overlays.
  error_then: =must-ignore
  type: xs:string
- _name: Title
  csv-header-name: title
  csv-type: InternationalizedText
  description: Official title held by the person. Clearable in overlays.
  error_then: =must-ignore
  type: InternationalizedText
