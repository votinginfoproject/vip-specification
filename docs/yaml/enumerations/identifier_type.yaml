_name: IdentifierType
csv-header-name: identifier_type
post: |-
  .. _states: http://en.wikipedia.org/wiki/Federal_Information_Processing_Standard_state_code
  .. _counties: http://en.wikipedia.org/wiki/FIPS_county_code
  .. _cities: http://geonames.usgs.gov/domestic/fips55codedef.html
  .. _`Open Civic Data Division Identifier`: http://docs.opencivicdata.org/en/latest/proposals/0002.html

  `IdentifierType` has two optional attributes:

    - `provider`: Optional source of the information, such as the department that provided the information or the geocoder that generated it.  For `geocoder-id`
tags:
- _name: fips
  description: Federal Information Processing Standards codes for states_, counties_,
    and cities_.
- _name: local-level
  description: An identifier generated or used by local governments or organizations.
- _name: national-level
  description: An identifier generated or used by national organizations.
- _name: ocd-id
  description: An `Open Civic Data Division Identifier`_.
- _name: state-level
  description: An identifier generated or used by state governments or organizations.
- _name: latlong
  description: A latitude/longitude pair, e.g.`40.6970243,-74.1443098`.
- _name: pluscode
  description: A Plus Code, e.g. `PXRX+86`.
- _name: geocoder-id
  description: A geocoder- or platform-specific device ID such as a Google Place ID.  The
    enclosing element is responsible for specifying the data provider/format along
    with the value.
- _name: other
  description: Any identifier which doesn't fall into any of the above categories.
